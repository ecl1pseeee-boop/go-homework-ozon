syntax = "proto3";

package cart;

option go_package = "github.com/ecl1pseeee-boop/go-homework-ozon/services_hm2/pkg/api/cart";

import "api/common/v1/product.proto";
import "google/api/annotations.proto";

service CartService {
  rpc AddProduct (AddProductRequest) returns (AddProductResponse) {
    options (google.api.)
  };
  rpc GetAllUserCarts (GetCartsRequest) returns (GetCartsResponse);
}

message GetCartsRequest {
  int64 user = 1;
}

message GetCartsResponse {
  repeated Cart items = 1;
  uint32 total_price = 2;
}

message Cart {
  common.v1.Product product = 1;
  uint32 count = 2;
}

message AddProductRequest {
  int64 user = 1;
  int64 sku = 2;
  uint32 count = 3;
}

message AddProductResponse {
  int64 sku = 1;
}